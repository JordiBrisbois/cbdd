[package]
name = "crvi-grc"
version = "2.0.1"
description = "CRVI - Gestion de la Relation Contact"
authors = ["Jordi Brisbois"]
license = "MIT"
repository = "https://github.com/JordiBrisbois/cbdd"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
pbkdf2 = "0.12"
sha2 = "0.10"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rust_xlsxwriter = "0.95.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
